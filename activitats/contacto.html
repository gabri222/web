<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

<body>

  <header class="header">
    <div class="container header-arriba">
      <h1 class="logo">Gabriel</h1>

      <nav class="nav">
        <a href="../index.html">Inicio</a>
        <a href="activitats.html">Actividades</a>
        <a href="sobremi.html">Acerca de mí</a>
        <a class="titulo" href="contacte.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="medio">
      <p class="presnetaciop">Contacto</p>
      <h2>Envíame un mensaje</h2>
      <p class="texto">
        Si quieres contactar conmigo, rellena este formulario.
      </p>

      <form class="formulario">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button type="submit">Enviar</button>

      </form>
    </section>

  </main>

  <footer class="footer">
    <div class="container footer-arriba">
      <p>2026 - Gabri Tito</p>
      <p class="abajo">HTML + CSS</p>
    </div>
  </footer>
